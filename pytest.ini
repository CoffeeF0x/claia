[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add the src directory to Python path
addopts = --import-mode=importlib

# Show extra test summary info
addopts = -ra -v

# Configure logging
log_cli = True
log_cli_level = INFO

# Disable warnings that aren't helpful
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning