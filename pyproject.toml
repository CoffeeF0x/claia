[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claia"
version = "0.1.0"
description = "CLAIA Framework"
requires-python = ">=3.12"
dependencies = [
  "torch",
  "diffusers",
  "transformers>=4.50.0",
  "aia",
  "beautifulsoup4",
  "chardet",
  "python-dotenv",
  "pluggy",
  "requests",
  "pyreadline3",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
claia = "claia.cli.__main__:main"

# Entry points for plugin system
[project.entry-points."claia.architectures"]
openai = "claia.model_architectures.openai:OpenAIPlugin"
anthropic = "claia.model_architectures.anthropic:AnthropicPlugin"
transformers_generic = "claia.model_architectures.transformers_generic:TransformersGenericPlugin"
transformers_gemma3 = "claia.model_architectures.transformers_gemma3:TransformersGemma3Plugin"
dummy = "claia.model_architectures.dummy:DummyArchitecturePlugin"

[project.entry-points."claia.deployments"]
api = "claia.deployments.api:APIDeploymentPlugin"
local = "claia.deployments.local:LocalDeploymentPlugin"
remote = "claia.deployments.remote:RemoteDeploymentPlugin"
dummy = "claia.deployments.dummy:DummyDeploymentPlugin"

[project.entry-points."claia.solvers"]
default = "claia.solvers.default:DefaultSolverPlugin"

[project.entry-points."claia.definitions"]
openai = "claia.model_definitions.openai:OpenAIDefinitionsPlugin"
anthropic = "claia.model_definitions.anthropic:AnthropicDefinitionsPlugin"
legacy = "claia.model_definitions.legacy:LegacyDefinitionsPlugin"

[project.entry-points."claia.agents"]
simple = "claia.agents.simple:SimpleAgentPlugin"

# Entry points for tools system
[project.entry-points."claia.tool_patterns"]
default = "claia.tool_patterns.default:DefaultToolPatternPlugin"

[project.entry-points."claia.tool_protocols"]
simple = "claia.tool_protocols.simple:SimpleProtocolPlugin"

[project.entry-points."claia.command_modules"]
sample = "claia.tool_modules.sample:SampleModulePlugin"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --import-mode=importlib --junitxml=report.xml"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
ignore_errors = true
omit = [
    "tests/*",
    "setup.py",
    "conftest.py",
]