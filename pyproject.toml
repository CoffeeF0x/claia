[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claia"
version = "0.1.18"
description = "CLAIA Framework"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Lloyd Bower" },
  { name = "ExoFox, LLC" }
]
requires-python = ">=3.12"
# Combined runtime deps for the CLI experience (the default `pip install .`
# install). The split optional-deps below let downstream consumers install
# only what each layer actually needs while we stay in monorepo form.
dependencies = [
  # claia.core
  "requests",
  "python-dotenv",
  "beautifulsoup4",
  "chardet<6",
  # claia.framework
  "pluggy",
  # claia.cli
  "pyfiglet",
  "pyreadline3",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
# Per-layer extras — each lists ONLY the deps unique to that layer. The
# default install above already covers all three layers; these are intended
# for the future repo split, where each package will own its own
# pyproject.toml and pull only its slice. Keeping them here documents the
# boundary today.
core = [
  "requests",
  "python-dotenv",
  "beautifulsoup4",
  "chardet<6",
]
framework = [
  "pluggy",
]
cli = [
  "pyfiglet",
  "pyreadline3",
]

# Optional model backends
local = [
  "torch",
  "diffusers",
  "transformers>=4.50.0",
]
audio = [
  "qwen-tts",
  "soundfile",
]

# Convenience meta-extras
all = [
  "claia[local]",
  "claia[audio]",
]
dev = [
  "claia[all]",
  "build",
  "pyinstaller",
  "pytest",
  "pytest-mock",
  "pytest-playwright",
  "playwright",
  "debugpy",
]

[project.urls]
Homepage = "https://claia.dev"
Repository = "https://gitlab.com/exofox/claia/claia.git"
Issues = "https://gitlab.com/exofox/claia/claia/-/issues"

[tool.setuptools.packages.find]
where = ["src"]
# `claia` itself is an implicit (PEP 420) namespace package — it has no
# top-level `__init__.py`. setuptools' find with `namespaces = true`
# (the default) picks up the `claia.core`, `claia.framework`, and
# `claia.cli` subpackages without requiring `claia` to be a regular
# package. When the repo splits, each subpackage moves into its own
# distribution and continues to ship under the same `claia.*` namespace.
include = ["claia*"]
namespaces = true

[tool.setuptools]
license-files = ["LICENSE", "NOTICE*"]

[project.scripts]
claia = "claia.cli.__main__:main"

# Plugin entry points. While in monorepo form, all built-in plugins live
# under claia.core and register against the framework's pluggy groups.
# When the repo splits, these tables move into claia.core's pyproject.toml.
#
# Group names are stable identifiers (e.g. `claia.architectures`) — they
# are NOT module paths and remain unchanged across the namespace
# migration so external plugins that already register against them keep
# working.
[project.entry-points."claia.architectures"]
openai = "claia.core.architectures.openai:OpenAIPlugin"
anthropic = "claia.core.architectures.anthropic:AnthropicPlugin"
openrouter = "claia.core.architectures.openrouter:OpenRouterPlugin"
transformers_generic = "claia.core.architectures.transformers_generic:TransformersGenericPlugin"
transformers_gemma3 = "claia.core.architectures.transformers_gemma3:TransformersGemma3Plugin"
diffusers = "claia.core.architectures.diffusers:DiffusersPlugin"
tts = "claia.core.architectures.tts:TTSPlugin"
dummy = "claia.core.architectures.dummy:DummyArchitecturePlugin"

[project.entry-points."claia.deployments"]
api = "claia.core.deployments.api:APIDeploymentPlugin"
local = "claia.core.deployments.local:LocalDeploymentPlugin"
remote = "claia.core.deployments.remote:RemoteDeploymentPlugin"
dummy = "claia.core.deployments.dummy:DummyDeploymentPlugin"

[project.entry-points."claia.solvers"]
default = "claia.core.solvers.default:DefaultSolverPlugin"

[project.entry-points."claia.definitions"]
openai = "claia.core.definitions.openai:OpenAIDefinitionsPlugin"
anthropic = "claia.core.definitions.anthropic:AnthropicDefinitionsPlugin"
openrouter = "claia.core.definitions.openrouter:OpenRouterDefinitionsPlugin"
legacy = "claia.core.definitions.legacy:LegacyDefinitionsPlugin"

[project.entry-points."claia.agents"]
simple = "claia.framework.agents.simple:SimpleAgentPlugin"

[project.entry-points."claia.tool_patterns"]
default = "claia.core.tools.patterns.default:DefaultToolPatternPlugin"

[project.entry-points."claia.tool_protocols"]
simple = "claia.core.tools.protocols.simple:SimpleProtocolPlugin"

[project.entry-points."claia.tool_modules"]
cli = "claia.cli.commands.extension:CLIModulePlugin"
sample = "claia.core.tools.modules.sample:SampleModulePlugin"
system = "claia.core.tools.modules.system:SystemModulePlugin"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --import-mode=importlib --junitxml=report.xml"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
ignore_errors = true
omit = [
    "tests/*",
    "setup.py",
    "conftest.py",
]
