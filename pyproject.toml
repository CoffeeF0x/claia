[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claia"
version = "0.1.0"
description = "CLAIA AI Assistant Framework"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

# Entry points for plugin system
[project.entry-points."claia.architectures"]
openai = "claia.src.models.architectures.openai:OpenAIPlugin"
anthropic = "claia.src.models.architectures.anthropic:AnthropicPlugin"
transformers_generic = "claia.src.models.architectures.transformers_generic:TransformersGenericPlugin"
transformers_gemma3 = "claia.src.models.architectures.transformers_gemma3:TransformersGemma3Plugin"
dummy = "claia.src.models.architectures.dummy:DummyArchitecturePlugin"

[project.entry-points."claia.deployments"]
api = "claia.src.models.deployments.api:APIDeploymentPlugin"
local = "claia.src.models.deployments.local:LocalDeploymentPlugin"
remote = "claia.src.models.deployments.remote:RemoteDeploymentPlugin"
dummy = "claia.src.models.deployments.dummy:DummyDeploymentPlugin"

[project.entry-points."claia.solvers"]
default = "claia.src.models.solvers.default:DefaultSolverPlugin"

[project.entry-points."claia.definitions"]
openai = "claia.src.models.definitions.openai:OpenAIDefinitionsPlugin"
anthropic = "claia.src.models.definitions.anthropic:AnthropicDefinitionsPlugin"
legacy = "claia.src.models.definitions.legacy:LegacyDefinitionsPlugin"

[project.entry-points."claia.agents"]
simple = "claia.src.agents.builtin.simple:SimpleAgentPlugin"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --import-mode=importlib --junitxml=report.xml"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
ignore_errors = true
omit = [
    "tests/*",
    "setup.py",
    "conftest.py",
]