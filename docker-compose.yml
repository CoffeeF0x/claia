volumes:
  ollama:

services:
  py:
    image: python:3.12-slim
    env_file:
      - .env
    volumes:
      - ./:/app

  dev:
    image: clai:dev
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./:/app

  ollama-server:
    image: ollama/ollama:latest
    env_file:
      - .env
    ports:
      - 11434:11434
    volumes:
      - ollama:/root/.ollama
